<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTester" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="shadowTester" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d9488" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgTester)" />

  <g transform="translate(130, 65)" filter="url(#shadowTester)">
    <!-- Multimeter Body (Bright Yellow / Teal rugged bumper) -->
    <rect x="0" y="0" width="140" height="245" rx="16" fill="#0f766e" stroke="#115e59" stroke-width="2" />
    <rect x="6" y="6" width="128" height="233" rx="12" fill="#14b8a6" />
    
    <!-- Inner Front Face -->
    <rect x="14" y="14" width="112" height="217" rx="8" fill="#1e293b" />

    <!-- Backlit LCD Digital Screen -->
    <rect x="22" y="24" width="96" height="48" rx="4" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <text x="70" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="24" font-weight="900" fill="#2dd4bf" letter-spacing="1">4.20V</text>
    <text x="105" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="9" font-weight="700" fill="#5eead4">DC</text>

    <!-- Rotary Range Selector Dial -->
    <circle cx="70" cy="125" r="32" fill="#334155" stroke="#475569" stroke-width="2" />
    <circle cx="70" cy="125" r="24" fill="#0f172a" />
    <!-- Pointer Notch -->
    <line x1="70" y1="125" x2="70" y2="104" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <!-- Dial Range Indicators -->
    <circle cx="70" cy="98" r="2.5" fill="#facc15" />
    <circle cx="92" cy="115" r="2.5" fill="#38bdf8" />
    <circle cx="92" cy="135" r="2.5" fill="#22c55e" />
    <circle cx="48" cy="115" r="2.5" fill="#f43f5e" />
    <circle cx="48" cy="135" r="2.5" fill="#a855f7" />

    <!-- Banana Jack Probe Jacks at Bottom -->
    <circle cx="35" cy="195" r="8" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <circle cx="35" cy="195" r="3" fill="#000000" />
    <text x="35" y="215" text-anchor="middle" font-size="7" font-weight="800" fill="#ef4444">V/Ω</text>

    <circle cx="70" cy="195" r="8" fill="#000000" stroke="#334155" stroke-width="2" />
    <circle cx="70" cy="195" r="3" fill="#ffffff" />
    <text x="70" y="215" text-anchor="middle" font-size="7" font-weight="800" fill="#94a3b8">COM</text>

    <circle cx="105" cy="195" r="8" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <circle cx="105" cy="195" r="3" fill="#000000" />
    <text x="105" y="215" text-anchor="middle" font-size="7" font-weight="800" fill="#ef4444">10A</text>
  </g>

  <!-- Badge -->
  <g transform="translate(200, 355)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0d9488" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.8">TESTER &amp; MULTIMETER</text>
  </g>
</svg>
