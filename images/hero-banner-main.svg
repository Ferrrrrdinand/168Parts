<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroPhoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="glowCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0" />
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Glowing Ambient Aura -->
  <circle cx="300" cy="240" r="180" fill="url(#glowCrimson)" opacity="0.35" />

  <!-- 3D Smartphone Assembly in Isometric/Perspective Angle -->
  <g transform="translate(180, 80) rotate(-12)" filter="url(#heroShadow)">
    <!-- Base Chassis / Housing Frame -->
    <rect x="0" y="0" width="220" height="340" rx="32" fill="#0f172a" stroke="#334155" stroke-width="3" />
    
    <!-- Motherboard Circuit Cutout & Shielding -->
    <rect x="18" y="24" width="184" height="292" rx="20" fill="#020617" />
    <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M 40 50 L 90 50 L 110 70 L 150 70" />
      <path d="M 50 120 L 100 120 L 120 140 L 170 140" />
      <path d="M 40 220 L 80 220 L 110 190 L 160 190" />
      <circle cx="90" cy="50" r="3" fill="#38bdf8" />
      <circle cx="100" cy="120" r="3" fill="#38bdf8" />
      <circle cx="80" cy="220" r="3" fill="#38bdf8" />
    </g>

    <!-- Center CPU / Processor Chip with Gold Core -->
    <rect x="70" y="90" width="80" height="80" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <circle cx="110" cy="130" r="16" fill="#be123c" />
    <text x="110" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" fill="#ffffff">168</text>

    <!-- Lithium Battery Chamber in Lower Half -->
    <rect x="35" y="185" width="150" height="110" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2" />
    <text x="110" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#4ade80">ORIGINAL BATTERY</text>
    <text x="110" y="260" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#86efac">100% HEALTH READY</text>
  </g>

  <!-- Floating LCD Screen Layer Ahead -->
  <g transform="translate(240, 100) rotate(-12)" filter="url(#heroShadow)">
    <rect x="0" y="0" width="210" height="325" rx="28" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" opacity="0.95" />
    <rect x="10" y="12" width="190" height="301" rx="20" fill="url(#heroPhoneScreen)" />
    
    <!-- Punch hole camera -->
    <circle cx="105" cy="26" r="4" fill="#0f172a" />
    
    <!-- Screen Display UI Graphic -->
    <rect x="25" y="70" width="160" height="80" rx="12" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" />
    <text x="105" y="102" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff">TRUE TONE</text>
    <text x="105" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#bae6fd">INCELL GRADE A+</text>

    <!-- Floating Checkmark Pill -->
    <g transform="translate(105, 230)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#22c55e" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff">✓ SIAP PASANG</text>
    </g>
  </g>

  <!-- Floating Precision LanRui Glue Tube at Top Left -->
  <g transform="translate(120, 240) rotate(25)" filter="url(#heroShadow)">
    <rect x="0" y="0" width="40" height="110" rx="6" fill="#be123c" stroke="#ffe4e6" stroke-width="2" />
    <rect x="6" y="20" width="28" height="60" rx="3" fill="#ffffff" />
    <text x="20" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#be123c">i9</text>
    <text x="20" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" fill="#0f172a">GLUE</text>
    <!-- Nozzle tip -->
    <polygon points="15,0 25,0 22,-20 18,-20" fill="#cbd5e1" />
  </g>
</svg>
