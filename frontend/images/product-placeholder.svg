<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="20" y="20" width="360" height="360" rx="16" ry="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Center Image / Photo Icon (Logo Foto Biasa) -->
  <g transform="translate(100, 95)">
    <!-- Photo Frame -->
    <rect x="0" y="0" width="200" height="155" rx="14" ry="14" fill="#ffffff" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sun / Circle -->
    <circle cx="55" cy="50" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="5" />
    <!-- Mountains / Landscape -->
    <path d="M8 147 L65 85 A6 6 0 0 1 74 85 L125 138" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M105 147 L140 108 A6 6 0 0 1 150 108 L192 147" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Label 'FOTO PRODUK' -->
  <text x="200" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5">FOTO PRODUK</text>
  
  <!-- Subtext Brand -->
  <text x="200" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">168 PARTS SURABAYA</text>
</svg>
