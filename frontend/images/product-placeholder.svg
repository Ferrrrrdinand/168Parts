<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle grid lines pattern for tech/sparepart feel -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4 4" />
    <line x1="0" y1="200" x2="400" y2="200" stroke-dasharray="4 4" />
    <line x1="0" y1="300" x2="400" y2="300" stroke-dasharray="4 4" />
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 4" />
    <line x1="200" y1="0" x2="200" y2="400" stroke-dasharray="4 4" />
    <line x1="300" y1="0" x2="300" y2="400" stroke-dasharray="4 4" />
  </g>

  <!-- Central Card -->
  <rect x="110" y="105" width="180" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleDrop)" />

  <!-- Electronic / Sparepart Icon (Chip & Phone Circuit) -->
  <g transform="translate(160, 145)" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main IC / Component Body -->
    <rect x="15" y="15" width="50" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" />
    <!-- Center Core dot -->
    <circle cx="40" cy="40" r="8" fill="#be123c" opacity="0.85" stroke="none" />
    <!-- Connector Pins Top -->
    <line x1="28" y1="5" x2="28" y2="15" />
    <line x1="40" y1="5" x2="40" y2="15" />
    <line x1="52" y1="5" x2="52" y2="15" />
    <!-- Connector Pins Bottom -->
    <line x1="28" y1="65" x2="28" y2="75" />
    <line x1="40" y1="65" x2="40" y2="75" />
    <line x1="52" y1="65" x2="52" y2="75" />
    <!-- Connector Pins Left -->
    <line x1="5" y1="28" x2="15" y2="28" />
    <line x1="5" y1="40" x2="15" y2="40" />
    <line x1="5" y1="52" x2="15" y2="52" />
    <!-- Connector Pins Right -->
    <line x1="65" y1="28" x2="75" y2="28" />
    <line x1="65" y1="40" x2="75" y2="40" />
    <line x1="65" y1="52" x2="75" y2="52" />
  </g>

  <!-- Branding Text -->
  <text x="200" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">168 PARTS</text>
  <text x="200" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">SPAREPART &amp; TOOLS</text>
</svg>
