<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSolder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="shadowSolder" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgSolder)" />

  <g transform="translate(200, 180)" filter="url(#shadowSolder)">
    <!-- Soldering Iron Station Body / Display -->
    <rect x="-85" y="-30" width="170" height="130" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Digital Temp Display -->
    <rect x="-65" y="-10" width="130" height="40" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="0" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="22" font-weight="900" fill="#22c55e" letter-spacing="2">350°C</text>

    <!-- Adjustment Knobs & Buttons -->
    <circle cx="-40" cy="60" r="14" fill="#475569" stroke="#64748b" stroke-width="2" />
    <line x1="-40" y1="52" x2="-40" y2="68" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="60" r="8" fill="#3b82f6" />
    <circle cx="40" cy="60" r="14" fill="#dc2626" stroke="#b91c1c" stroke-width="2" />

    <!-- Soldering Pen (Heated Tip) -->
    <g transform="translate(60, -80) rotate(-45)">
      <!-- Ergonomic Grip -->
      <rect x="-12" y="20" width="24" height="90" rx="6" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
      <rect x="-10" y="35" width="20" height="30" rx="3" fill="#92400e" />
      <!-- Metal Sleeve -->
      <rect x="-6" y="-30" width="12" height="50" fill="#94a3b8" stroke="#475569" />
      <!-- Heated Copper / Silver Tip -->
      <polygon points="-6,-30 6,-30 1,-60 -1,-60" fill="#f59e0b" stroke="#d97706" />
      <!-- Glow effect around tip -->
      <circle cx="0" cy="-60" r="10" fill="#ef4444" opacity="0.3" filter="blur(3px)" />
    </g>

    <!-- Rosin Core Solder Wire Spool Left -->
    <g transform="translate(-100, 30)">
      <rect x="-15" y="-30" width="30" height="50" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
      <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#cbd5e1" stroke-width="3" />
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#cbd5e1" stroke-width="3" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#cbd5e1" stroke-width="3" />
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#cbd5e1" stroke-width="3" />
      <!-- Curved wire string -->
      <path d="M 0 -30 Q 20 -60 40 -30" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(200, 355)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#d97706" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.8">SOLDER &amp; TIMAH 350°C</text>
  </g>
</svg>

