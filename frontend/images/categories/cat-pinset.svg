<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPinset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="shadowPinset" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgPinset)" />

  <g transform="translate(200, 175) rotate(-25)" filter="url(#shadowPinset)">
    <!-- Titanium ESD Tweezers Body -->
    <!-- Top arm -->
    <path d="M -8 110 L -6 0 Q -5 -60 0 -110 Q 3 -60 4 0 L 6 110 Z" fill="#047857" stroke="#065f46" stroke-width="2" />
    <!-- Ultra fine curved tip -->
    <path d="M 0 -110 Q 8 -135 15 -145 L 12 -145 Q 5 -130 0 -110 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    
    <!-- Grip Cutouts (Holes on Handle) -->
    <circle cx="0" cy="30" r="4" fill="#d1fae5" />
    <circle cx="0" cy="50" r="4" fill="#d1fae5" />
    <circle cx="0" cy="70" r="4" fill="#d1fae5" />
    <circle cx="0" cy="90" r="4" fill="#d1fae5" />

    <!-- ESD Anti-Static Label -->
    <text x="0" y="-10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="900" fill="#a7f3d0" transform="rotate(-90 0 -10)">ESD-15 TITANIUM</text>

    <!-- Micro SMD Component being held at tip -->
    <rect x="13" y="-148" width="6" height="4" rx="1" fill="#f59e0b" stroke="#78350f" stroke-width="1" />
  </g>

  <!-- Badge -->
  <g transform="translate(200, 355)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#059669" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.8">PINSET ESD TITANIUM</text>
  </g>
</svg>

