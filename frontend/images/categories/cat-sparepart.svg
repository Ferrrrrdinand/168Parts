<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSpare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <filter id="shadowSpare" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#be123c" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgSpare)" />

  <g transform="translate(130, 75)" filter="url(#shadowSpare)">
    <!-- Flexible Ribbon Cable & USB Board Module -->
    <!-- Gold/Amber Polyimide Flexible Circuit -->
    <path d="M 40 20 Q 80 50 40 120 T 40 190 L 100 190 Q 140 150 100 120 T 100 20 Z" fill="#d97706" opacity="0.85" stroke="#b45309" stroke-width="2" />
    
    <!-- Fine Conductive Gold Traces Inside -->
    <g stroke="#fde047" stroke-width="1.5" fill="none">
      <path d="M 50 25 Q 90 55 50 125 T 50 185" />
      <path d="M 60 25 Q 100 55 60 125 T 60 185" />
      <path d="M 70 25 Q 110 55 70 125 T 70 185" />
      <path d="M 80 25 Q 120 55 80 125 T 80 185" />
      <path d="M 90 25 Q 130 55 90 125 T 90 185" />
    </g>

    <!-- Sub-board PCB at bottom (Charging Port Board) -->
    <rect x="20" y="190" width="100" height="45" rx="6" fill="#15803d" stroke="#166534" stroke-width="2" />
    <!-- Type-C Metal Port -->
    <rect x="45" y="215" width="50" height="20" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <rect x="52" y="222" width="36" height="6" rx="3" fill="#0f172a" />
    <!-- Microphone Hole -->
    <circle cx="32" cy="210" r="3" fill="#0f172a" />

    <!-- Connector FPC at top -->
    <rect x="30" y="5" width="80" height="20" rx="3" fill="#1e293b" stroke="#334155" />
    <!-- Gold pins -->
    <g fill="#f59e0b">
      <rect x="36" y="8" width="5" height="14" rx="1" />
      <rect x="45" y="8" width="5" height="14" rx="1" />
      <rect x="54" y="8" width="5" height="14" rx="1" />
      <rect x="63" y="8" width="5" height="14" rx="1" />
      <rect x="72" y="8" width="5" height="14" rx="1" />
      <rect x="81" y="8" width="5" height="14" rx="1" />
      <rect x="90" y="8" width="5" height="14" rx="1" />
      <rect x="99" y="8" width="5" height="14" rx="1" />
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(200, 355)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#be123c" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.8">FLEKSIBEL &amp; KONEKTOR</text>
  </g>
</svg>

