      <rect x="0" y="0" width="108" height="60" rx="8" fill="#ffffff" />
      <text x="54" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#be123c">DISKON 50%</text>
      <text x="54" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#475569">KLAIM SEKARANG</text>
    </g>
    <g transform="translate(18, 170)">
      <rect x="0" y="0" width="108" height="60" rx="8" fill="#ffffff" />
      <text x="54" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#0284c7">100RB</text>
      <text x="54" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#475569">VOUCHER TEKNISI</text>
    </g>
