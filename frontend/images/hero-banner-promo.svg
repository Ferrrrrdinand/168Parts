<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="promoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#promoGrad)" rx="6" />

  <!-- Smartphone Mockup -->
  <g transform="translate(70, 40)">
    <rect x="0" y="0" width="160" height="320" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="8" y="10" width="144" height="300" rx="18" fill="#0284c7" />
    <!-- Dynamic island -->
    <rect x="52" y="16" width="40" height="10" rx="5" fill="#0f172a" />
    <!-- Voucher ticket graphic -->
